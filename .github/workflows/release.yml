name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Release binaries are built with the current stable Go so that they get
      # its standard-library security fixes; go.mod only states the minimum.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no third-party modules, nothing to cache
      - run: go version
      - run: make test
      - run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
